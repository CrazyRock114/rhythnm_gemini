<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>节奏之王 · The King of Rhythm</title>
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
<div id="app">
  <canvas id="game-canvas" width="960" height="540"></canvas>

  <!-- 标题画面 -->
  <div id="screen-title" class="screen">
    <div class="panel">
      <!-- 语言选择栏 -->
      <div class="lang-bar">
        <button class="lang-btn" data-lang="zh">🇨🇳 中文</button>
        <button class="lang-btn" data-lang="en">🇺🇸 English</button>
        <button class="lang-btn" data-lang="ja">🇯🇵 日本語</button>
        <button class="lang-btn" data-lang="es">🇪🇸 Español</button>
        <button class="lang-btn" data-lang="ar">🇸🇦 العربية</button>
        <button class="lang-btn" data-lang="hi">🇮🇳 हिन्दी</button>
      </div>
      <h1 class="game-title" data-i18n="game_title">节奏之王</h1>
      <p class="subtitle" data-i18n="subtitle">THE KING OF RHYTHM</p>
      <p class="hint" data-i18n="hint_start">跟着音乐节拍，在正确的瞬间按键！</p>
      <button id="btn-start" class="btn btn-big" data-i18n="btn_start">开始游戏</button>
      <p class="hint dim" data-i18n="hint_audio">（首次点击会开启声音，请调高音量 🔊）</p>
      <button id="btn-sound-check" class="btn btn-sound" data-i18n="btn_sound_check">🔊 试听音效</button>
    </div>
  </div>

  <!-- 选关画面 -->
  <div id="screen-select" class="screen hidden">
    <div class="panel">
      <div class="select-header">
        <h2 data-i18n="select_level">选择关卡</h2>
        <div class="lang-bar compact">
          <button class="lang-btn" data-lang="zh">🇨🇳 中文</button>
          <button class="lang-btn" data-lang="en">🇺🇸 English</button>
          <button class="lang-btn" data-lang="ja">🇯🇵 日本語</button>
          <button class="lang-btn" data-lang="es">🇪🇸 Español</button>
          <button class="lang-btn" data-lang="ar">🇸🇦 العربية</button>
          <button class="lang-btn" data-lang="hi">🇮🇳 हिन्दी</button>
        </div>
      </div>
      <div id="level-list"></div>
    </div>
  </div>

  <!-- 结算画面 -->
  <div id="screen-result" class="screen hidden">
    <div class="panel">
      <div id="result-rank">S</div>
      <div id="result-mode"></div>
      <div id="result-comment">太出色了！</div>
      <div id="result-stats"></div>
      <div class="btn-row">
        <button id="btn-retry" class="btn" data-i18n="btn_retry">再来一次</button>
        <button id="btn-back" class="btn" data-i18n="btn_back">返回选关</button>
      </div>
    </div>
  </div>

  <!-- 难度选择 -->
  <div id="screen-diff" class="screen hidden">
    <div class="panel">
      <h2 id="diff-title" data-i18n="select_diff">选择难度</h2>
      <p id="diff-desc" class="hint"></p>
      <div class="btn-row">
        <button class="btn btn-diff easy" data-mode="easy" data-i18n="diff_easy">简单</button>
        <button class="btn btn-diff normal" data-mode="normal" data-i18n="diff_normal">普通</button>
        <button class="btn btn-diff hard" data-mode="hard" data-i18n="diff_hard">困难</button>
      </div>
      <div id="diff-best"></div>
      <button id="btn-diff-back" class="btn" data-i18n="btn_diff_back">返回</button>
    </div>
  </div>

  <div id="hud-tip" class="hidden">空格 / 点击 = 击打 &nbsp;·&nbsp; Esc = 退出</div>
  <div id="zone-left" class="hidden">F</div>
  <div id="zone-right" class="hidden">空格</div>
  <div id="rotate-hint">
    <div class="icon">📱↻</div>
    <p data-i18n="rotate_hint" data-i18n-html="true">建议横屏游玩<br>浏览器不支持横屏也没关系：</p>
    <div class="btn-row">
      <button id="btn-force-landscape" class="btn" data-i18n="btn_force_landscape">强制横屏显示</button>
      <button id="btn-portrait-continue" class="btn" data-i18n="btn_portrait_continue">竖屏继续玩</button>
    </div>
  </div>
</div>

<script src="js/i18n.js"></script>
<script src="js/audio.js"></script>
<script src="js/conductor.js"></script>
<script src="js/animals.js"></script>
<script src="js/levels.js"></script>
<script src="js/levels2.js"></script>
<script src="js/levels3.js"></script>
<script src="js/levels4.js"></script>
<script src="js/levels5.js"></script>
<script src="js/levels6.js"></script>
<script src="js/levels7.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
